version: "3.9"

services:
  api:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    environment:
      - DATABASE_URL=postgresql+psycopg2://risk:risk@db:5432/risk
      - REDIS_URL=redis://redis:6379/0
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=risk
      - POSTGRES_PASSWORD=risk
      - POSTGRES_DB=risk
    ports:
      - "5433:5432"
    volumes:
      - risk_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

volumes:
  risk_data: