apiVersion: kustomize.config.k8s.io/v1
kind: Patch
metadata:
  name: set-image-tag
  namespace: risk
spec:
  apply:
    - deployment
  patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/image
      value: PLACEHOLDER_ACR_LOGIN_SERVER/market-risk-analytics-platform:PLACEHOLDER_COMMIT_SHA