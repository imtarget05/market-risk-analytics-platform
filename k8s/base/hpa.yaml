apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: market-risk-api-hpa
  namespace: risk
  labels:
    app: market-risk-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: market-risk-api
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70