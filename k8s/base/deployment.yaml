apiVersion: apps/v1
kind: Deployment
metadata:
  name: market-risk-api
  namespace: risk
  labels:
    app: market-risk-api
    component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: market-risk-api
  template:
    metadata:
      labels:
        app: market-risk-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
        - name: api
          image: PLACEHOLDER_ACR_LOGIN_SERVER/market-risk-analytics-platform:PLACEHOLDER_TAG
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - secretRef:
                name: market-risk-secrets
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: market-risk-secrets
                  key: database-url
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: market-risk-secrets
                  key: secret-key
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3