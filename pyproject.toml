[project]
name = "market-risk-analytics-platform"
version = "0.1.0"
description = "Portfolio risk analytics with VaR, Expected Shortfall, Monte Carlo simulation and stress-testing dashboards."
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn==0.34.0",
    "sqlalchemy==2.0.36",
    "psycopg2-binary==2.9.10",
    "alembic==1.13.2",
    "pydantic==2.9.2",
    "pydantic-settings==2.4.0",
    "python-dotenv==1.0.1",
    "redis==5.1.0",
    "numpy==1.26.4",
    "pandas==2.2.2",
    "scipy==1.13.0",
    "pytest==8.3.3",
    "httpx==0.27.2",
    "pyjwt==2.15.1",
]

[project.optional-dependencies]
dev = [
    "ruff==0.8.0",
    "mypy==1.11.0",
    "black==24.10.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src/backend"]
include = ["app*"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = ["B008", "UP035", "DTZ003"]
select = ["E", "F", "I", "B", "UP"]